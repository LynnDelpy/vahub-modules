# The manifest the hub reads. `vahub module add calculator` copies this into
# /etc/vahub/modules.d/ and expands {venv}. Validated by the Manifest model.
schema_version: 1
name: calculator
version: 0.1.0
description: Evaluate arithmetic safely, with common math functions and constants
homepage: https://github.com/LynnDelpy/vahub-modules/tree/main/modules/calculator

runtime:
  command: ["{venv}/bin/python", "-m", "vahub_mod_calculator"]

health:
  # Pure computation, nothing to reach, so probe rarely.
  interval_s: 600
  timeout_s: 5

tools:
  calculate:
    class: read
    description: Evaluate an arithmetic expression and return the number
