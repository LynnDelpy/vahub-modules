[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vahub-mod-transit"
version = "0.1.0"
description = "vahub Swiss public transport module (MCP server over stdio)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=1.4,<2",
  "httpx>=0.27,<1",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/vahub_mod_transit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
